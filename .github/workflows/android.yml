name: Android Pull Request & Master CI

on:
  pull_request:
    branches:
      - 'master'
  push:
    branches:
      - 'master'
  workflow_dispatch:

jobs:
  apk:
    name: Generate APK
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4.2.2
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          sdk-components: 'build-tools;29.0.3'
      - name: set up JDK 1.11
        uses: actions/setup-java@v3
        with:
          java-version: '11' # Or '17', or '21'
          distribution: 'temurin'
          cache: gradle
      - uses: actions/cache@v3.4.3
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}
          restore-keys: | 
                ${{ runner.os }}-gradle-
      - name: Build debug APK
        run: bash ./gradlew assembleDebug --stacktrace
      - name: Build release APK
        run: bash ./gradlew assembleRelease
      - name: Upload debug APK
        uses: actions/upload-artifact@v4.6.1
        with:
          name: app-debug.apk
          path: app/build/outputs/apk/debug/
      - name: Upload release APK (unsigned)
        uses: actions/upload-artifact@v4.6.1
        with:
          name: app-release-unsigned.apk
          path: app/build/outputs/apk/release/
      - name: Sign Android release
        uses: r0adkll/sign-android-release@v1
        with:
          releaseDirectory: app/build/outputs/apk/release/
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          alias: ${{ secrets.ALIAS }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
          signedReleaseFile: app/build/outputs/apk/release/PhotonCamera.apk
      - name: Upload signed release APK
        uses: actions/upload-artifact@v4.6.1
        with:
          name: PhotonCamera.apk
          path: app/build/outputs/apk/release/PhotonCamera.apk
